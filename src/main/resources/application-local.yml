server:
  servlet:
    context-path: /inventory

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  http:
    serviceclient:
      bbd-user-service:
        base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081/user}
      bbd-item-service:
        base-url: ${ITEM_SERVICE_BASE_URL:http://localhost:8082}
      bbd-inventory-service:
        base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8083}
      bbd-procurement-service:
        base-url: ${PROCUREMENT_SERVICE_BASE_URL:http://localhost:8084}
      bbd-sales-service:
        base-url: ${SALES_SERVICE_BASE_URL:http://localhost:8085}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  application:
    name: inventory

  threads:
    virtual:
      enabled: true # 자바 21 버전을 통해서 이번에 버츄얼 스레드도 한번 써보기

#  datasource:
#    url: ${DB_ENDPOINT}
#    username: ${DB_NAME}
#    password: ${DB_PASSWORD}
#    driver-class-name: org.postgresql.Driver

  datasource:
    url: ${DB_ENDPOINT:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_NAME:inventory_user}
    password: ${DB_PASSWORD:inventory_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul

# kafka config now in base application.yaml (applies to all profiles);
# override per-env with KAFKA_BOOTSTRAP / KAFKA_OFFSET_RESET if needed.

bbd:
  security:
    enabled: true
    permit-all-paths:
      - /actuator/health
      - /actuator/health/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**

# Swagger
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    config-url: /inventory/v3/api-docs/swagger-config
    url: /inventory/v3/api-docs

logging:
  level:
    com.bbd.inventory: DEBUG
    org.apache.kafka: INFO
    org.springframework.kafka: INFO

items:
  base-url: http://100.73.142.41/item




